<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ps5-discord</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #161a22; --line: #252b36; --text: #e6e9ef; --dim: #8a93a3;
    --accent: #5865f2; --ok: #3ba55d; --warn: #faa61a; --bad: #ed4245;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; }
  .pill { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
          background: var(--line); color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
  .pill.ready { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .pill.login, .pill.scanned, .pill.connecting { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.stopped, .pill.offline { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .value { font-size: 22px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
  #login { display: none; text-align: center; margin-bottom: 16px; }
  #login.show { display: block; }
  #qr { background: #fff; padding: 16px; border-radius: 12px; width: min(320px, 100%); image-rendering: pixelated; }
  #login p { color: var(--dim); margin: 12px 0 0; }
  #log { font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; height: 320px; overflow: auto;
         white-space: pre-wrap; overflow-wrap: anywhere; color: #c3c9d4; margin: 8px 0 0; }
  button { background: transparent; color: var(--bad); border: 1px solid var(--bad); border-radius: 8px;
           padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  button.armed { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ps5-discord</h1>
    <span id="state" class="pill">...</span>
    <button id="stop" type="button">Stop payload</button>
  </header>

  <section id="login" class="card">
    <canvas id="qr" width="1" height="1" aria-label="Discord login QR code"></canvas>
    <p id="hint">Scan with the Discord mobile app: Settings, then Scan QR Code.</p>
  </section>

  <section class="grid">
    <div class="card"><div class="label">Account</div><div class="value" id="user">-</div></div>
    <div class="card"><div class="label">Servers</div><div class="value" id="guilds">-</div></div>
    <div class="card"><div class="label">DMs</div><div class="value" id="dms">-</div></div>
    <div class="card"><div class="label">Events</div><div class="value" id="events">-</div></div>
    <div class="card"><div class="label">Uptime</div><div class="value" id="uptime">-</div></div>
  </section>

  <section class="card">
    <div class="label">Log</div>
    <pre id="log"></pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let lastQr = "", lastLog = "";

function drawQr(bits, size) {
  const c = $("qr"), scale = 8, quiet = 2, n = size + quiet * 2;
  c.width = c.height = n * scale;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#000";
  for (let y = 0; y < size; y++)
    for (let x = 0; x < size; x++)
      if (bits[y * size + x] === "1") g.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
}

function fmtUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
}

async function poll() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    const s = await r.json();
    $("state").textContent = s.state;
    $("state").className = "pill " + s.state;
    $("user").textContent = s.user || "-";
    $("guilds").textContent = s.user ? s.guilds : "-";
    $("dms").textContent = s.user ? s.dms : "-";
    $("events").textContent = s.events;
    $("uptime").textContent = fmtUptime(s.uptime);
    const showQr = s.qr_size > 0;
    $("login").classList.toggle("show", showQr || s.state === "scanned");
    $("qr").style.display = showQr ? "" : "none";
    $("hint").textContent = s.state === "scanned"
      ? "Scanned. Approve the login on your phone."
      : "Scan with the Discord mobile app: Settings, then Scan QR Code.";
    if (showQr && s.qr !== lastQr) { drawQr(s.qr, s.qr_size); lastQr = s.qr; }
    const log = s.log.join("\n");
    if (log !== lastLog) {
      const el = $("log"), atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
      el.textContent = log; lastLog = log;
      if (atEnd) el.scrollTop = el.scrollHeight;
    }
  } catch {
    $("state").textContent = "offline";
    $("state").className = "pill offline";
  }
}

// Two-step stop so one stray click does not kill the session.
$("stop").addEventListener("click", async () => {
  const b = $("stop");
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "Click again to stop";
    setTimeout(() => { b.classList.remove("armed"); b.textContent = "Stop payload"; }, 3000);
    return;
  }
  await fetch("/api/quit", {method: "POST", headers: {"X-Discord-Native": "1"}}).catch(() => {});
  b.classList.remove("armed"); b.textContent = "Stopped";
});

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
